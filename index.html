<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetriLab - Control de Medidores</title>
  <!-- Agrega aquí tus estilos y librerías externas si las tienes en el head -->
</head>
<body>

  <!-- Contenedor principal de tu aplicación -->
  <div id="app-container">
    <!-- Aquí va toda tu estructura HTML visual original -->
  </div>

  <!-- SCRIPTS Y LÓGICA DE METRILAB -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    // ==========================================
    // PROCESAMIENTO DE FOTOS CON GEMINI (CON PARSER SEGURO)
    // ==========================================
    async function procesarFoto(file, slot) {
      const reader = new FileReader();
      reader.onload = async function(e) {
        const tiempoInicio = Date.now();
        const imgOptimizada = await redimensionarImagen(e.target.result, 1024);
        const base64 = imgOptimizada.split(',')[1];
        const mime = 'image/jpeg';

        // Las 3 claves rotan: cada foto usa una clave distinta para procesar en
        // paralelo, y si esa falla, prueba con las otras dos antes de rendirse
        const TODAS_CLAVES = [
          localStorage.getItem('metrilab_key'),
          localStorage.getItem('metrilab_key_2'),
          localStorage.getItem('metrilab_key_3')
        ].filter(k => k);
        const inicio = slot % TODAS_CLAVES.length;
        const CLAVES = [...TODAS_CLAVES.slice(inicio), ...TODAS_CLAVES.slice(0, inicio)];

        let datos = null;
        let huboLimiteCuota = false;

        async function intentarConClaves() {
          for (const key of CLAVES) {
            try {
              const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({contents:[{parts:[{text:PROMPT},{inline_data:{mime_type:mime,data:base64}}]}]})
              });
              if (resp.status === 429) {
                console.error('Clave con cuota agotada (429), probando siguiente:', key.slice(0,15));
                huboLimiteCuota = true;
                continue;
              }
              const data = await resp.json();
              if (data.error || !data.candidates || !data.candidates[0]?.content?.parts?.[0]?.text) { 
                continue; 
              } 
              
              // PARSER SEGURO Y ROBUSTO CON REGEX (Evita fallos si la IA responde con texto extra)
              const textoCrudo = data.candidates[0].content.parts[0].text;
              const matchJson = textoCrudo.match(/\{[\s\S]*\}/);
              if (!matchJson) {
                continue;
              }
              const textoLimpio = matchJson[0].trim();
              return JSON.parse(textoLimpio);

            } catch(err) {
              console.error('Clave falló, probando siguiente:', err);
              continue;
            }
          }
          return null;
        }

        datos = await intentarConClaves();

        // Si TODAS las claves dieron 429 (cuota agotada), espera 8 segundos y reintenta una vez más
        if (!datos && huboLimiteCuota) {
          showToast('⏳ Cuota de IA agotada, reintentando en unos segundos...');
          await new Promise(r => setTimeout(r, 8000));
          huboLimiteCuota = false;
          datos = await intentarConClaves();
        }

        if (datos) {
          // Rellenar defaults
          if (!datos.marca) datos.marca = 'METREX';
          if (!datos.modelo) datos.modelo = 'G1.6';
          if (!datos.unidad) datos.unidad = 'm3';
          if (!datos.volumen_ciclico) datos.volumen_ciclico = '0.7 dm3';
          // Limpiar ceros a la izquierda del registro
          if (datos.registro) {
            datos.registro = datos.registro.replace(/^0+/, '') || '0';
          }

          loteActual[slot] = datos;
          fotosActual[slot] = imgOptimizada;
          tiemposProcesamiento[slot] = Date.now() - tiempoInicio;

          sincronizarMedidorConFirebase(slot, datos);

          // Alerta de anomalía
          const anomalia = detectarAnomalia();
          const contWarn = document.getElementById('warning-anomaly-container');
          contWarn.innerHTML = anomalia ? `<div class="warning-anomaly">${anomalia}</div>` : '';

          document.getElementById('seccion-observaciones').style.display = 'block';
        } else {
          loteActual[slot] = { error: true };
          fotosActual[slot] = imgOptimizada;
          document.getElementById('seccion-observaciones').style.display = 'block';
        }
        actualizarProgreso();
        renderObservaciones();
      };
      reader.readAsDataURL(file);
    }

    // ==========================================
    // RENDER OBSERVACIONES CON CAMPOS EXTRA
    // ==========================================
    function renderObservaciones() {
      const cont = document.getElementById('lista-observaciones');
      cont.innerHTML = loteActual.map((d, i) => {
        if (!d || d.procesando) {
          return `<div class="medidor-item"><div class="medidor-num">#${i+1}</div><div class="medidor-data">⏳ Analizando foto...</div></div>`;
        }
        if (d.error) {
          return `<div class="medidor-item"><div style="display:flex;justify-content:space-between;align-items:center"><div class="medidor-num">#${i+1}</div><button class="btn-delete" onclick="eliminarMedidor(${i})">🗑️ Eliminar</button></div><div class="medidor-data" style="color:#fca5a5">⚠️ No se pudo leer. Elimina y vuelve a tomar la foto.</div></div>`;
        }
        const faltantes = validarCampos(d);
        const regInicial = parseFloat((d.registro || '0').replace(',', '.'));
        const regFinal = parseFloat((registrosFinalesActual[i] || '0').replace(',', '.'));
        const diff = (!isNaN(regInicial) && !isNaN(regFinal) && registrosFinalesActual[i]) ? (regFinal - regInicial).toFixed(3).replace('.', ',') : null;

        let camposFaltantes = '';
        if (faltantes.length > 0) {
          camposFaltantes = faltantes.map(f => `
            <div class="field-manual">
              <label>Falta: ${f.replace('_',' ').toUpperCase()}</label>
              <input type="text" placeholder="Ingresa manualmente" value="${d[f] || ''}" onchange="actualizarCampo(${i}, '${f}', this.value)">
            </div>
          `).join('');
        }

        return `
        <div class="medidor-item">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px">
            <div class="medidor-num">#${i+1}</div>
            <div style="display:flex;align-items:center;gap:6px;flex:1;justify-content:flex-end">
              <span style="font-size:10px;color:var(--text-secondary)">Mover a:</span>
              <input type="number" min="1" max="${loteActual.length}" value="${i+1}" style="width:44px;padding:6px;font-size:12px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:6px;color:var(--text-main);text-align:center" onchange="moverMedidor(${i}, this.value)">
              <button class="btn-delete" onclick="eliminarMedidor(${i})">🗑️</button>
            </div>
          </div>
          <div class="medidor-data">Serie: ${d.serie_medidor || 'FALTA'} · Año: ${d.anio_medidor || 'N/D'} · Registro inicial: ${d.registro || 'FALTA'} ${d.unidad || ''}</div>
          ${camposFaltantes}
          <select class="medidor-select ${observacionesActual[i]?'':'empty'}" onchange="cambiarObservacion(${i}, this.value)">
            <option value="">— Selecciona observación —</option>
            ${OBSERVACIONES.map(o => `<option value="${o}" ${observacionesActual[i]===o?'selected':''}>${o}</option>`).join('')}
          </select>
          <div class="med-field">
            <div class="med-field-item">
              <label>Registro final (m³)</label>
              <input type="text" class="${registrosFinalesActual[i]?'':'empty'}" placeholder="Ej: 00960,150" value="${registrosFinalesActual[i]||''}" onchange="cambiarRegistroFinal(${i}, this.value)">
            </div>
            <div class="med-field-item">
              <label>Diferencia</label>
              <input type="text" value="${diff !== null ? diff + ' m³' : '—'}" readonly style="background:rgba(46,139,87,0.1)">
            </div>
          </div>
          ${diff !== null ? `<div class="med-diff">Volumen: ${diff} m³</div>` : ''}
          <textarea class="textarea-box" placeholder="Comentarios adicionales (opcional)" onchange="cambiarComentario(${i}, this.value)">${comentariosActual[i]||''}</textarea>
        </div>
      `;
      }).join('');
      actualizarBotonFinalizar();
    }

    function actualizarCampo(idx, campo, valor) {
      loteActual[idx][campo] = valor;
      renderObservaciones();
    }

    function cambiarObservacion(idx, valor) {
      observacionesActual[idx] = valor;
      renderObservaciones();
    }

    function cambiarRegistroFinal(idx, valor) {
      registrosFinalesActual[idx] = valor;
      renderObservaciones();
    }

    function cambiarComentario(idx, valor) {
      comentariosActual[idx] = valor;
    }

    function moverMedidor(idxActual, valorInput) {
      const nuevaPos = parseInt(valorInput, 10) - 1;
      const max = loteActual.length - 1;
      if (isNaN(nuevaPos) || nuevaPos < 0 || nuevaPos > max || nuevaPos === idxActual) {
        renderObservaciones();
        return;
      }
      function moverEnArray(arr) {
        const [item] = arr.splice(idxActual, 1);
        arr.splice(nuevaPos, 0, item);
      }
      moverEnArray(loteActual);
      moverEnArray(fotosActual);
      moverEnArray(observacionesActual);
      moverEnArray(comentariosActual);
      moverEnArray(registrosFinalesActual);
      moverEnArray(tiemposProcesamiento);
      renderObservaciones();
      resincronizarOrdenConFirebase();
    }

    async function resincronizarOrdenConFirebase() {
      if (!loteFirebaseId) return;
      const nuevoMapa = {};
      loteActual.forEach((d, i) => {
        if (!d || d.procesando || d.error) return;
        nuevoMapa[i] = {
          serie_medidor: d.serie_medidor || '',
          anio: d.anio_medidor || 'N/D',
          registro: String(d.registro || '0'),
          unidad: 'm³',
          serie_precinto: d.serie_precinto || 'N/D',
          estado: 'foto_tomada',
          fecha_ultimo_cambio: new Date()
        };
      });
      const ok = await window.reordenarMedidoresEnFirebase(loteFirebaseId, nuevoMapa);
      if (!ok) showToast('⚠️ El reordenamiento no se sincronizó con el panel del jefe');
    }

    function eliminarMedidor(idx) {
      if (loteActual.some(d => !d || d.procesando)) { showToast('Espera a que terminen de procesarse las fotos antes de eliminar'); return; }
      if (!confirm(`¿Eliminar el medidor #${idx+1}?`)) return;
      loteActual.splice(idx, 1);
      fotosActual.splice(idx, 1);
      observacionesActual.splice(idx, 1);
      comentariosActual.splice(idx, 1);
      registrosFinalesActual.splice(idx, 1);
      tiemposProcesamiento.splice(idx, 1);
      siguienteSlot--;
      actualizarProgreso();
      if (loteActual.length === 0) {
        document.getElementById('resultado-actual').innerHTML = '';
        document.getElementById('seccion-observaciones').style.display = 'none';
        document.getElementById('warning-anomaly-container').innerHTML = '';
      } else {
        renderObservaciones();
      }
      showToast('Medidor eliminado');
    }

    function actualizarBotonFinalizar() {
      const obsLlenas = observacionesActual.length > 0 && observacionesActual.every(o => o !== "");
      const regLlenos = registrosFinalesActual.length > 0 && registrosFinalesActual.every(r => r !== "");
      const camposLlenos = loteActual.every(d => validarCampos(d).length === 0);
      const confirmado = document.getElementById('confirmar-check')?.checked;
      document.getElementById('btn-finalizar').disabled = !(obsLlenas && regLlenos && camposLlenos && confirmado);
      const btnPendiente = document.getElementById('btn-pendiente');
      if (btnPendiente) btnPendiente.disabled = !(obsLlenas && camposLlenos) || !!loteEnEdicion;
    }

    function actualizarProgreso() {
      const n = loteActual.length;
      document.getElementById('progreso-txt').textContent = `${n} / 12`;
      document.getElementById('progress-fill').style.width = `${(n/12)*100}%`;
    }

    // ==========================================
    // LOTES PENDIENTES (localStorage original)
    // ==========================================
    function guardarComoPendiente() {
      if (loteActual.length === 0) { showToast('No hay medidores'); return; }
      if (!observacionesActual.every(o => o !== "")) { showToast('Faltan observaciones'); return; }
      if (loteEnEdicion) { showToast('Este lote ya estaba pendiente'); return; }

      const operario = document.getElementById('operario-select').value;
      const lote = loteCodigoAsignado || getLote();
      const fecha = getFecha();

      lotesPendientes.push({
        lote, fecha, operario,
        medidores: loteActual, fotos: fotosActual,
        observaciones: observacionesActual, comentarios: comentariosActual,
        horaInicio: Date.now(),
        firebaseId: loteFirebaseId
      });
      localStorage.setItem('metrilab_pendientes', JSON.stringify(lotesPendientes));

      loteActual = [];
      fotosActual = [];
      observacionesActual = [];
      comentariosActual = [];
      registrosFinalesActual = [];
      tiemposProcesamiento = [];
      siguienteSlot = 0;
      loteFirebaseId = null;
      loteCodigoAsignado = null;
      creandoLotePromise = null;
      document.getElementById('resultado-actual').innerHTML = '';
      document.getElementById('warning-anomaly-container').innerHTML = '';
      document.getElementById('lista-observaciones').innerHTML = '';
      document.getElementById('seccion-observaciones').style.display = 'none';
      document.getElementById('confirmar-check').checked = false;
      document.getElementById('file-camara').value = '';
      document.getElementById('file-galeria').value = '';
      actualizarProgreso();
      iniciarRegistro();
      actualizarBadgePendientes();
      showToast(`⏸️ Lote ${lote} guardado como pendiente. Complétalo cuando tengas los resultados finales.`);
    }

    function actualizarBadgePendientes() {
      const listos = lotesPendientes.filter(p => (Date.now() - p.horaInicio) >= TIEMPO_ESPERA_MIN * 60000).length;
      const badge = document.getElementById('badge-pendientes');
      if (!badge) return;
      if (listos > 0) {
        badge.style.display = 'flex';
        badge.textContent = listos;
      } else {
        badge.style.display = 'none';
      }
    }

    function actualizarPendientes() {
      const cont = document.getElementById('pendientes-lista');
      if (lotesPendientes.length === 0) {
        cont.innerHTML = `<div class="empty-state"><p>No hay lotes pendientes</p><span>Los lotes en espera de resultado final aparecerán aquí</span></div>`;
        return;
      }
      cont.innerHTML = [...lotesPendientes].sort((a, b) => a.horaInicio - b.horaInicio).map((p) => {
        const minutos = Math.floor((Date.now() - p.horaInicio) / 60000);
        const listo = minutos >= TIEMPO_ESPERA_MIN;
        return `
        <div class="glass-card" style="${listo ? 'border-color:rgba(16,185,129,0.4)' : ''}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="font-size:14px;font-weight:600;color:var(--text-main)">${p.lote}</span>
            <span class="badge" style="${listo ? 'background:rgba(16,185,129,0.15);color:#10b981;border-color:rgba(16,185,129,0.3)' : 'background:rgba(245,158,11,0.15);color:#f59e0b;border-color:rgba(245,158,11,0.3)'}">${listo ? '✅ Listo' : `⏳ ${minutos} min`}</span>
          </div>
          <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">${p.fecha} · ${p.operario} · ${p.medidores.length} medidores</div>
          <button class="btn-secondary" style="width:100%;margin-bottom:8px" onclick="completarPendiente('${p.lote}')">✏️ Completar resultado final</button>
          <button class="btn-delete" style="width:100%;padding:8px" onclick="descartarPendiente('${p.lote}')">🗑️ Descartar</button>
        </div>`;
      }).join('');
    }

    function completarPendiente(loteCodigo) {
      const idx = lotesPendientes.findIndex(p => p.lote === loteCodigo);
      if (idx === -1) return;
      const p = lotesPendientes[idx];

      loteActual = p.medidores;
      fotosActual = p.fotos;
      observacionesActual = p.observaciones;
      comentariosActual = p.comentarios;
      registrosFinalesActual = p.medidores.map(() => "");
      tiemposProcesamiento = [];
      siguienteSlot = p.medidores.length;
      loteEnEdicion = { lote: p.lote, fecha: p.fecha };
      loteFirebaseId = p.firebaseId || null;
      loteCodigoAsignado = p.lote;

      lotesPendientes.splice(idx, 1);
      localStorage.setItem('metrilab_pendientes', JSON.stringify(lotesPendientes));
      actualizarBadgePendientes();

      document.getElementById('operario-select').value = p.operario;
      goTo('registro');
      actualizarProgreso();
      document.getElementById('seccion-observaciones').style.display = 'block';
      renderObservaciones();
      showToast(`Completa el registro final del lote ${p.lote}`);
    }

    function descartarPendiente(loteCodigo) {
      if (!confirm(`¿Descartar el lote pendiente ${loteCodigo}? Esta acción no se puede deshacer.`)) return;
      lotesPendientes = lotesPendientes.filter(p => p.lote !== loteCodigo);
      localStorage.setItem('metrilab_pendientes', JSON.stringify(lotesPendientes));
      actualizarBadgePendientes();
      actualizarPendientes();
      showToast('Lote pendiente descartado');
    }

    async function finalizarLote() {
      if (loteActual.length === 0) { showToast('No hay medidores'); return; }
      if (!observacionesActual.every(o => o !== "")) { showToast('Faltan observaciones'); return; }
      if (!registrosFinalesActual.every(r => r !== "")) { showToast('Faltan registros finales'); return; }
      if (!document.getElementById('confirmar-check').checked) { showToast('Confirma la supervisión'); return; }
      if (typeof window.guardarLoteEnFirebase !== 'function') {
        showToast('⚠️ Aún está cargando la conexión con el panel del jefe. Espera 2-3 segundos e inténtalo de nuevo.');
        return;
      }

      const operario = document.getElementById('operario-select').value;
      const lote = loteEnEdicion ? loteEnEdicion.lote : (loteCodigoAsignado || getLote());
      const fecha = loteEnEdicion ? loteEnEdicion.fecha : getFecha();

      const datosLote = loteActual;
      const datosFotos = fotosActual;
      const datosObservaciones = observacionesActual;
      const datosComentarios = comentariosActual;
      const datosRegistrosFinales = registrosFinalesActual;

      showToast('☁️ Sincronizando con el panel del jefe...');
      let firebaseId = loteFirebaseId;
      try {
        if (firebaseId) {
          await window.finalizarLoteEnFirebase(firebaseId, datosObservaciones, datosRegistrosFinales, datosLote);
        } else {
          firebaseId = await window.guardarLoteEnFirebase(lote, operario, fecha, datosLote, datosObservaciones, datosRegistrosFinales);
        }
      } catch (e) {
        console.error('Error inesperado sincronizando con Firebase:', e);
      }
      if (!firebaseId) {
        showToast('⚠️ No se pudo sincronizar con el panel del jefe, pero el reporte se generará igual');
      }

      const nuevoLote = {lote, fecha, operario, medidores: datosLote, observaciones: datosObservaciones, comentarios: datosComentarios, registrosFinales: datosRegistrosFinales, firebaseId: firebaseId || null, eliminado: false, motivo: null};
      historial.push(nuevoLote);
      if (historial.length > MAX_HISTORIAL) historial = historial.slice(-MAX_HISTORIAL);
      localStorage.setItem('metrilab_historial', JSON.stringify(historial));

      showToast('✨ Generando reporte...');
      await generarZIP(datosLote, datosFotos, datosObservaciones, datosComentarios, datosRegistrosFinales, operario, fecha, lote);

      loteActual = [];
      fotosActual = [];
      observacionesActual = [];
      comentariosActual = [];
      registrosFinalesActual = [];
      tiemposProcesamiento = [];
      siguienteSlot = 0;
      loteEnEdicion = null;
      loteFirebaseId = null;
      loteCodigoAsignado = null;
      creandoLotePromise = null;
      document.getElementById('resultado-actual').innerHTML = '';
      document.getElementById('warning-anomaly-container').innerHTML = '';
      document.getElementById('lista-observaciones').innerHTML = '';
      document.getElementById('seccion-observaciones').style.display = 'none';
      document.getElementById('confirmar-check').checked = false;
      document.getElementById('file-camara').value = '';
      document.getElementById('file-galeria').value = '';
      actualizarProgreso();
      iniciarRegistro();
      showToast('✅ Lote finalizado y datos limpiados');
    }

    // ==========================================
    // GENERAR EXCEL + ZIP
    // ==========================================
    async function generarZIP(datos, fotos, observaciones, comentarios, registrosFinales, operario, fecha, lote) {
      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet('Registro');

      const AZUL = '17375E', AZUL_CLARO = 'D9EAF7', VERDE = '2E8B57', VERDE_CLARO = 'EAF7EE';
      const ROJO = 'C0392B', GRIS = 'F4F6F7', BLANCO = 'FFFFFF', AMARILLO = 'FCF3CF';
      const AZUL_LINK = '1E40AF';

      const borde = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}};
      const bordeMedio = {top:{style:'medium'}, left:{style:'medium'}, bottom:{style:'medium'}, right:{style:'medium'}};

      const total = datos.length;
      const anchos = [5, 10, 10, 16, 10, 11, 10, 10, 16, 16, 16, 12, 10, 25, 5, 14, 5, 12, 8, 2.11];
      anchos.forEach((a, i) => { ws.getColumn(i+1).width = a; });

      function aplicar(celda, valor, opts={}) {
        const c = ws.getCell(celda);
        c.value = valor;
        c.font = {bold:opts.negrita||false, size:opts.tam||10, color:{argb:'FF'+(opts.color_texto||'000000')}, italic:opts.italica||false};
        c.alignment = {horizontal:opts.alineacion||'center', vertical:'middle', wrapText:opts.wrap!==false};
        if (opts.color_fondo) c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF'+opts.color_fondo}};
        c.border = opts.borde || borde;
      }

      ws.mergeCells('A1:T1');
      aplicar('A1', 'LABORATORIO DE MEDIDORES DE GAS', {negrita:true, tam:18, color_texto:BLANCO, color_fondo:AZUL, borde:bordeMedio});
      ws.getRow(1).height = 35;
      ws.mergeCells('A2:T2');
      aplicar('A2', 'Reporte automático de inspección y registro de medidores', {tam:10, italica:true, color_texto:'404040', color_fondo:GRIS});
      ws.getRow(2).height = 18;
      ws.mergeCells('A3:D3');
      aplicar('A3', `👤 Operario: ${operario}`, {negrita:true, color_fondo:AZUL_CLARO, alineacion:'left'});
      ws.mergeCells('E3:M3');
      aplicar('E3', `📅 Fecha: ${fecha}`, {negrita:true, color_fondo:AZUL_CLARO});
      ws.mergeCells('N3:T3');
      aplicar('N3', `🏷 Lote: ${lote}`, {negrita:true, color_texto:BLANCO, color_fondo:AZUL});
      ws.getRow(3).height = 22;
      ws.getRow(4).height = 6;

      const marcaT = datos[0]?.marca || 'METREX';
      const modeloT = datos[0]?.modelo || 'G1.6';
      const tarjetas = [
        ['A5:E6', 'TOTAL DE\nMEDIDORES', String(total), AZUL_CLARO],
        ['F5:J6', 'MARCA DEL\nLOTE', marcaT, VERDE_CLARO],
        ['K5:N6', 'MODELO', modeloT, 'F4ECF7'],
        ['O5:S6', 'ESTADO DEL\nLOTE', 'APROBADO', VERDE_CLARO]
      ];
      const AZUL_OSCURO_TARJETA = '17375E';
      tarjetas.forEach(([rango, titulo, valor, color]) => {
        ws.mergeCells(rango);
        aplicar(rango.split(':')[0], `${titulo}\n${valor}`, {negrita:true, tam:11, color_texto:'FFFFFF', color_fondo:AZUL_OSCURO_TARJETA, borde:bordeMedio});
      });
      ws.getRow(5).height = 28;
      ws.getRow(6).height = 28;
      ws.getRow(7).height = 6;

      ws.mergeCells('A8:N8');
      aplicar('A8', 'RESUMEN DE MEDIDORES DEL LOTE', {negrita:true, tam:11, color_texto:BLANCO, color_fondo:AZUL});
      ws.getRow(8).height = 22;

      const cols = ['#','Marca','Modelo','Nro. Serie Medidor','Año','Vol. Cíclico','Tipo','Color','Nro. Serie Precinto','Registro Inicial (m³)','Registro Final (m³)','Diferencia (m³)','Foto','Observación'];
      cols.forEach((h, i) => {
        aplicar(ws.getCell(9, i+1).address, h, {negrita:true, tam:9, color_texto:BLANCO, color_fondo:ROJO});
      });
      ws.getRow(9).height = 26.4;

      const nombresImagenes = datos.map((d, i) => `${String(i+1).padStart(2,'0')}_${d.serie_medidor}.png`);

      datos.forEach((d, i) => {
        const fila = 10 + i;
        const colorFila = i % 2 === 0 ? GRIS : BLANCO;
        const obs = observaciones[i] || 'NINGUNA';

        const regIni = parseFloat((d.registro || '0').replace(',', '.'));
        const regFin = parseFloat((registrosFinales[i] || '0').replace(',', '.'));
        const diff = (!isNaN(regIni) && !isNaN(regFin) && registrosFinales[i]) ? (regFin - regIni).toFixed(3).replace('.', ',') : 'N/D';

        const valores = [
          i+1, d.marca||'METREX', d.modelo||'G1.6', d.serie_medidor, d.anio_medidor || 'N/D',
          '0.7 dm³', 'Circular', 'Verde', d.serie_precinto || 'N/D',
          `${d.registro} m³`, `${registrosFinales[i]} m³`, `${diff} m³`, '', obs
        ];
        valores.forEach((v, j) => {
          const col = j + 1;
          let fondo = colorFila;
          if (col === 14 && obs !== 'NINGUNA') fondo = 'FDEDEC';
          if (col === 12) fondo = 'D5F5E3';
          aplicar(ws.getCell(fila, col).address, v, {tam:9, color_fondo:fondo});
          if (col === 14) ws.getCell(fila, col).alignment = {horizontal:'center', vertical:'middle', wrapText:false};
        });
        const cLink = ws.getCell(fila, 13);
        cLink.value = {text: `📷 Ver foto ${i+1}`, hyperlink: `imagenes/${nombresImagenes[i]}`};
        cLink.font = {bold:true, size:9, color:{argb:'FF'+AZUL_LINK}, underline:true};
        cLink.alignment = {horizontal:'center', vertical:'middle'};
        cLink.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF'+VERDE_CLARO}};
        cLink.border = borde;
        ws.getRow(fila).height = 16;
      });

      const filaComentariosInicio = 10 + total + 2;
      const tieneComentarios = comentarios.some(c => c && c.trim() !== '');
      if (tieneComentarios) {
        ws.mergeCells(`A${filaComentariosInicio}:N${filaComentariosInicio}`);
        aplicar(`A${filaComentariosInicio}`, 'COMENTARIOS ADICIONALES', {negrita:true, tam:11, color_texto:BLANCO, color_fondo:VERDE});
        ws.getRow(filaComentariosInicio).height = 22;

        let f = filaComentariosInicio + 1;
        comentarios.forEach((c, i) => {
          if (c && c.trim() !== '') {
            ws.mergeCells(`A${f}:B${f}`);
            aplicar(`A${f}`, `#${i+1} (Serie ${datos[i].serie_medidor})`, {negrita:true, tam:9, color_fondo:AZUL_CLARO, alineacion:'left'});
            ws.mergeCells(`C${f}:N${f}`);
            aplicar(`C${f}`, c, {tam:9, color_fondo:BLANCO, alineacion:'left'});
            ws.getRow(f).height = 18;
            f++;
          }
        });
      }

      ws.mergeCells('O8:T8');
      aplicar('O8', 'DETALLES DEL LOTE', {negrita:true, tam:11, color_texto:BLANCO, color_fondo:AZUL});

      const detalles = [
        ['Lote:', lote], ['Fecha y hora:', fecha], ['Operario:', operario],
        ['Marca:', marcaT], ['Modelo:', modeloT], ['Tipo:', 'Circular'],
        ['Vol. Cíclico:', '0.7 dm³ (fijo)'], ['Color:', 'Verde'],
        ['Total medidores:', String(total)], ['Supervisados:', `${total} (100%)`]
      ];
      detalles.forEach(([k, v], i) => {
        const f = 9 + i;
        ws.mergeCells(`O${f}:P${f}`);
        aplicar(`O${f}`, k, {negrita:true, tam:8, color_fondo:AZUL_CLARO, alineacion:'left'});
        ws.mergeCells(`Q${f}:T${f}`);
        aplicar(`Q${f}`, v, {tam:8, color_fondo:BLANCO, alineacion:'left'});
        ws.getRow(f).height = 16;
      });

      const certFila = 9 + detalles.length + 1;
      ws.mergeCells(`O${certFila}:T${certFila+2}`);
      aplicar(`O${certFila}`, `Certifico que el proceso fue supervisado correctamente\n— ${operario} —\n${fecha}`, {negrita:true, italica:true, tam:8, color_fondo:VERDE_CLARO, borde:bordeMedio});
      ws.getRow(certFila).height = 18;
      ws.getRow(certFila+1).height = 18;
      ws.getRow(certFila+2).height = 18;

      const estFila = certFila + 4;
      ws.mergeCells(`O${estFila}:T${estFila}`);
      aplicar(`O${estFila}`, 'RESUMEN DE OBSERVACIONES', {negrita:true, tam:10, color_texto:BLANCO, color_fondo:VERDE});
      ws.getRow(estFila).height = 20;

      const sinObs = observaciones.filter(o => o === 'NINGUNA').length;
      const conObs = total - sinObs;
      const stats = [['Sin observación', sinObs, VERDE_CLARO], ['Con observación', conObs, AMARILLO]];
      stats.forEach(([n, v, c], i) => {
        const fr = estFila + 1 + i;
        ws.mergeCells(`O${fr}:Q${fr}`);
        aplicar(`O${fr}`, n, {tam:9, color_fondo:c});
        ws.mergeCells(`R${fr}:T${fr}`);
        aplicar(`R${fr}`, `${v} (${total ? Math.round(v/total*100) : 0}%)`, {negrita:true, tam:9, color_fondo:c});
        ws.getRow(fr).height = 16;
      });

      const excelBuffer = await wb.xlsx.writeBuffer();
      const zip = new JSZip();
      zip.file(`Reporte_${lote}.xlsx`, excelBuffer);
      const imgFolder = zip.folder("imagenes");
      for (let i = 0; i < fotos.length; i++) {
        const base64 = fotos[i].split(',')[1];
        imgFolder.file(nombresImagenes[i], base64, {base64: true});
      }
      const blob = await zip.generateAsync({type:'blob'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `MetriLab_${lote}.zip`;
      a.click();
    }

    function limpiarDatos() {
      if (confirm('¿Eliminar todos los datos?')) {
        historial = [];
        contadorLoteDia = {};
        lotesPendientes = [];
        localStorage.removeItem('metrilab_historial');
        localStorage.removeItem('metrilab_contador');
        localStorage.removeItem('metrilab_pendientes');
        actualizarAdmin();
        actualizarBadgePendientes();
        showToast('Datos eliminados');
      }
    }
  </script>
</body>
</html>

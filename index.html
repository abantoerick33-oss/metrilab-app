<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetriLab - Control de Medidores</title>
  <!-- Aquí van tus estilos, librerías (ExcelJS, JSZip, Firebase, etc.) -->
</head>
<body>

<!-- Estructura HTML de tu aplicación (Pantallas, Navegación, etc.) -->
<div id="app-container">
  <!-- Contenido de la app -->
</div>

<!-- SCRIPTS Y LÓGICA PRINCIPAL -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
  // ==========================================
  // 1. GESTIÓN DE INDEXEDDB PARA LOTES PENDIENTES
  // ==========================================
  const DB_NAME = 'MetriLabDB';
  const STORE_NAME = 'lotes_pendientes';
  let dbInstance = null;

  function abrirIndexedDB() {
    return new Promise((resolve, reject) => {
      if (dbInstance) return resolve(dbInstance);
      const request = indexedDB.open(DB_NAME, 1);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => {
        dbInstance = request.result;
        resolve(dbInstance);
      };
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.objectStoreNames.createIndex(STORE_NAME, 'lote', { unique: true });
        }
      };
    });
  }

  async function guardarPendienteDB(loteObj) {
    const db = await abrirIndexedDB();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, 'readwrite');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.put(loteObj);
      request.onsuccess = () => resolve(true);
      request.onerror = () => reject(request.error);
    });
  }

  async function obtenerTodosPendientesDB() {
    const db = await abrirIndexedDB();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, 'readonly');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  async function eliminarPendienteDB(loteCodigo) {
    const db = await abrirIndexedDB();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, 'readwrite');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.delete(loteCodigo);
      request.onsuccess = () => resolve(true);
      request.onerror = () => reject(request.error);
    });
  }

  // ==========================================
  // 2. PROCESAMIENTO DE FOTOS CON GEMINI (CON PARSER ROBUSTO)
  // ==========================================
  async function procesarFoto(file, slot) {
    const reader = new FileReader();
    reader.onload = async function(e) {
      const tiempoInicio = Date.now();
      const imgOptimizada = await redimensionarImagen(e.target.result, 1024);
      const base64 = imgOptimizada.split(',')[1];
      const mime = 'image/jpeg';

      const TODAS_CLAVES = [
        localStorage.getItem('metrilab_key'),
        localStorage.getItem('metrilab_key_2'),
        localStorage.getItem('metrilab_key_3')
      ].filter(k => k);
      
      const inicio = slot % TODAS_CLAVES.length;
      const CLAVES = [...TODAS_CLAVES.slice(inicio), ...TODAS_CLAVES.slice(0, inicio)];

      let datos = null;
      let huboLimiteCuota = false;

      async function intentarConClaves() {
        for (const key of CLAVES) {
          try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({contents:[{parts:[{text:PROMPT},{inline_data:{mime_type:mime,data:base64}}]}]})
            });
            
            if (resp.status === 429) {
              console.error('Clave con cuota agotada (429), probando siguiente:', key.slice(0,15));
              huboLimiteCuota = true;
              continue;
            }
            
            const data = await resp.json();
            if (data.error || !data.candidates || !data.candidates[0]?.content?.parts?.[0]?.text) { 
              continue; 
            } 
            
            // Extracción segura y robusta del bloque JSON mediante RegEx
            const textoCrudo = data.candidates[0].content.parts[0].text;
            const matchJson = textoCrudo.match(/\{[\s\S]*\}/);
            if (!matchJson) {
              console.warn('La respuesta de la IA no contiene un bloque JSON válido, probando siguiente clave...');
              continue;
            }
            
            const textoLimpio = matchJson[0].trim();
            return JSON.parse(textoLimpio);

          } catch(err) {
            console.error('Clave falló, probando siguiente:', err);
            continue;
          }
        }
        return null;
      }

      datos = await intentarConClaves();

      if (!datos && huboLimiteCuota) {
        showToast('⏳ Cuota de IA agotada, reintentando en unos segundos...');
        await new Promise(r => setTimeout(r, 8000));
        huboLimiteCuota = false;
        datos = await intentarConClaves();
      }

      if (datos) {
        if (!datos.marca) datos.marca = 'METREX';
        if (!datos.modelo) datos.modelo = 'G1.6';
        if (!datos.unidad) datos.unidad = 'm3';
        if (!datos.volumen_ciclico) datos.volumen_ciclico = '0.7 dm3';
        if (datos.registro) {
          datos.registro = datos.registro.replace(/^0+/, '') || '0';
        }

        loteActual[slot] = datos;
        fotosActual[slot] = imgOptimizada;
        tiemposProcesamiento[slot] = Date.now() - tiempoInicio;

        sincronizarMedidorConFirebase(slot, datos);

        const anomalia = detectarAnomalia();
        const contWarn = document.getElementById('warning-anomaly-container');
        contWarn.innerHTML = anomalia ? `<div class="warning-anomaly">${anomalia}</div>` : '';

        document.getElementById('seccion-observaciones').style.display = 'block';
      } else {
        loteActual[slot] = { error: true };
        fotosActual[slot] = imgOptimizada;
        document.getElementById('seccion-observaciones').style.display = 'block';
      }
      actualizarProgreso();
      renderObservaciones();
    };
    reader.readAsDataURL(file);
  }

  // ==========================================
  // 3. GESTIÓN DE LOTES PENDIENTES CON INDEXEDDB
  // ==========================================
  async function guardarComoPendiente() {
    if (loteActual.length === 0) { showToast('No hay medidores'); return; }
    if (!observacionesActual.every(o => o !== "")) { showToast('Faltan observaciones'); return; }
    if (loteEnEdicion) { showToast('Este lote ya estaba pendiente'); return; }

    const operario = document.getElementById('operario-select').value;
    const lote = loteCodigoAsignado || getLote();
    const fecha = getFecha();

    const nuevoPendiente = {
      lote, fecha, operario,
      medidores: loteActual, fotos: fotosActual,
      observaciones: observacionesActual, comentarios: comentariosActual,
      horaInicio: Date.now(),
      firebaseId: loteFirebaseId
    };

    try {
      await guardarPendienteDB(nuevoPendiente);
    } catch (err) {
      console.error('Error guardando en IndexedDB:', err);
      showToast('⚠️ Error al guardar el lote pendiente en la memoria local');
      return;
    }

    loteActual = [];
    fotosActual = [];
    observacionesActual = [];
    comentariosActual = [];
    registrosFinalesActual = [];
    tiemposProcesamiento = [];
    siguienteSlot = 0;
    loteFirebaseId = null;
    loteCodigoAsignado = null;
    creandoLotePromise = null;
    
    document.getElementById('resultado-actual').innerHTML = '';
    document.getElementById('warning-anomaly-container').innerHTML = '';
    document.getElementById('lista-observaciones').innerHTML = '';
    document.getElementById('seccion-observaciones').style.display = 'none';
    document.getElementById('confirmar-check').checked = false;
    document.getElementById('file-camara').value = '';
    document.getElementById('file-galeria').value = '';
    
    actualizarProgreso();
    iniciarRegistro();
    await actualizarBadgePendientes();
    showToast(`⏸️ Lote ${lote} guardado como pendiente de forma segura.`);
  }

  async function actualizarBadgePendientes() {
    const lotesPendientes = await obtenerTodosPendientesDB();
    const listos = lotesPendientes.filter(p => (Date.now() - p.horaInicio) >= TIEMPO_ESPERA_MIN * 60000).length;
    const badge = document.getElementById('badge-pendientes');
    if (!badge) return;
    if (listos > 0) {
      badge.style.display = 'flex';
      badge.textContent = listos;
    } else {
      badge.style.display = 'none';
    }
  }

  async function actualizarPendientes() {
    const cont = document.getElementById('pendientes-lista');
    const lotesPendientes = await obtenerTodosPendientesDB();
    
    if (lotesPendientes.length === 0) {
      cont.innerHTML = `<div class="empty-state"><p>No hay lotes pendientes</p><span>Los lotes en espera de resultado final aparecerán aquí</span></div>`;
      return;
    }
    
    cont.innerHTML = [...lotesPendientes].sort((a, b) => a.horaInicio - b.horaInicio).map((p) => {
      const minutos = Math.floor((Date.now() - p.horaInicio) / 60000);
      const listo = minutos >= TIEMPO_ESPERA_MIN;
      return `
      <div class="glass-card" style="${listo ? 'border-color:rgba(16,185,129,0.4)' : ''}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:14px;font-weight:600;color:var(--text-main)">${p.lote}</span>
          <span class="badge" style="${listo ? 'background:rgba(16,185,129,0.15);color:#10b981;border-color:rgba(16,185,129,0.3)' : 'background:rgba(245,158,11,0.15);color:#f59e0b;border-color:rgba(245,158,11,0.3)'}">${listo ? '✅ Listo' : `⏳ ${minutos} min`}</span>
        </div>
        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">${p.fecha} · ${p.operario} · ${p.medidores.length} medidores</div>
        <button class="btn-secondary" style="width:100%;margin-bottom:8px" onclick="completarPendiente('${p.lote}')">✏️ Completar resultado final</button>
        <button class="btn-delete" style="width:100%;padding:8px" onclick="descartarPendiente('${p.lote}')">🗑️ Descartar</button>
      </div>`;
    }).join('');
  }

  async function completarPendiente(loteCodigo) {
    const lotesPendientes = await obtenerTodosPendientesDB();
    const p = lotesPendientes.find(item => item.lote === loteCodigo);
    if (!p) return;

    loteActual = p.medidores;
    fotosActual = p.fotos;
    observacionesActual = p.observaciones;
    comentariosActual = p.comentarios;
    registrosFinalesActual = p.medidores.map(() => "");
    tiemposProcesamiento = [];
    siguienteSlot = p.medidores.length;
    loteEnEdicion = { lote: p.lote, fecha: p.fecha };
    loteFirebaseId = p.firebaseId || null;
    loteCodigoAsignado = p.lote;

    await eliminarPendienteDB(p.lote);
    await actualizarBadgePendientes();

    document.getElementById('operario-select').value = p.operario;
    goTo('registro');
    actualizarProgreso();
    document.getElementById('seccion-observaciones').style.display = 'block';
    renderObservaciones();
    showToast(`Completa el registro final del lote ${p.lote}`);
  }

  async function descartarPendiente(loteCodigo) {
    if (!confirm(`¿Descartar el lote pendiente ${loteCodigo}? Esta acción no se puede deshacer.`)) return;
    await eliminarPendienteDB(loteCodigo);
    await actualizarBadgePendientes();
    await actualizarPendientes();
    showToast('Lote pendiente descartado');
  }
</script>
</body>
</html>

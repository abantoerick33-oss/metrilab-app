<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0F">
  <title>MetriLab Jefe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A0A0F;
      color: white;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1A1A2E 0%, #0A0A0F 100%);
      z-index: -2;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(155, 89, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
      z-index: -1;
      pointer-events: none;
    }
    #app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 20px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .topbar-title { font-size: 24px; font-weight: bold; background: linear-gradient(135deg, #9B59F6, #00D4FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .bell-wrap { position: relative; cursor: pointer; }
    .bell-wrap svg { width: 26px; height: 26px; fill: rgba(255,255,255,0.7); }
    .badge-count {
      position: absolute; top: -6px; right: -6px;
      background: #E24B4A; color: white; font-size: 11px; font-weight: bold;
      min-width: 18px; height: 18px; border-radius: 9px;
      display: none; align-items: center; justify-content: center; padding: 0 4px;
    }
    .badge-count.show { display: flex; }
    .glass-card {
      background: linear-gradient(135deg, rgba(26, 26, 46, 0.7), rgba(42, 26, 62, 0.3));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(58, 46, 93, 0.3);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .glass-card.new { border-color: rgba(0, 212, 255, 0.6); box-shadow: 0 0 20px rgba(0, 212, 255, 0.2); }
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .metric-card { padding: 16px; background: linear-gradient(135deg, rgba(26, 26, 46, 0.5), rgba(10, 10, 15, 0.5)); border-radius: 16px; border: 1px solid rgba(155, 89, 246, 0.2); text-align: center; }
    .metric-val { font-size: 26px; font-weight: bold; }
    .metric-label { color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 4px; }
    .lote-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .lote-title { font-size: 14px; font-weight: 600; }
    .lote-sub { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 4px; }
    .badge { display: inline-block; padding: 3px 9px; border-radius: 8px; font-size: 11px; font-weight: 500; background: rgba(0, 212, 255, 0.15); color: #00D4FF; border: 1px solid rgba(0, 212, 255, 0.3); white-space: nowrap; }
    .empty-state { padding: 40px 20px; text-align: center; color: rgba(255,255,255,0.5); font-size: 14px; }
    .permiso-box { background: rgba(155, 89, 246, 0.12); border: 1px solid rgba(155, 89, 246, 0.35); border-radius: 12px; padding: 14px; margin-bottom: 16px; font-size: 13px; display: none; }
    .permiso-box.show { display: block; }
    .permiso-box button { margin-top: 10px; background: linear-gradient(135deg,#9B59F6,#00D4FF); color: white; border: none; border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: rgba(255,255,255,0.9); }
    .observ-tag { display: inline-block; margin-top: 6px; font-size: 10px; padding: 2px 7px; border-radius: 6px; background: rgba(245,158,11,0.15); color: #f5b350; border: 1px solid rgba(245,158,11,0.3); }
  </style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-title">🌙 MetriLab Jefe</div>
    <div class="bell-wrap" onclick="marcarComoVisto()">
      <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      <div class="badge-count" id="badge-count">0</div>
    </div>
  </div>

  <div class="permiso-box" id="permiso-box">
    Activa las alertas para que te avisemos en este dispositivo apenas se registre un lote nuevo (mientras tengas esta página abierta).
    <br>
    <button onclick="pedirPermiso()">Activar alertas</button>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-val" id="total-lotes">0</div>
      <div class="metric-label">Lotes totales</div>
    </div>
    <div class="metric-card">
      <div class="metric-val" id="total-medidores">0</div>
      <div class="metric-label">Medidores totales</div>
    </div>
  </div>

  <div class="section-title">📋 Lotes recientes</div>
  <div id="lista-lotes">
    <div class="empty-state">Cargando lotes...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCpRopyllFTQu3puQtRlLWAy83JXXgvXI0",
    authDomain: "metrilab-appjefe.firebaseapp.com",
    projectId: "metrilab-appjefe",
    storageBucket: "metrilab-appjefe.firebasestorage.app",
    messagingSenderId: "407817648389",
    appId: "1:407817648389:web:425dcf5f446ecd3a2f5f6c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const ultimoVisto = localStorage.getItem('jefe_ultimo_visto') || '0';
  let primerCarga = true;
  let ultimoIdVisto = ultimoVisto;
  let nuevosNoLeidos = 0;

  window.pedirPermiso = function () {
    Notification.requestPermission().then(permiso => {
      if (permiso === 'granted') {
        document.getElementById('permiso-box').classList.remove('show');
        localStorage.setItem('jefe_permiso_pedido', '1');
        new Notification('MetriLab Jefe', { body: 'Alertas activadas. Te avisaremos con cada lote nuevo.' });
      }
    });
  };

  window.marcarComoVisto = function () {
    nuevosNoLeidos = 0;
    document.getElementById('badge-count').classList.remove('show');
  };

  if (!('Notification' in window)) {
    // Navegador sin soporte de notificaciones, no mostramos el cuadro
  } else if (Notification.permission === 'default' && !localStorage.getItem('jefe_permiso_pedido')) {
    document.getElementById('permiso-box').classList.add('show');
  }

  const q = query(collection(db, 'lotes'), orderBy('creado', 'desc'), limit(30));

  onSnapshot(q, (snapshot) => {
    const lotes = [];
    snapshot.forEach(doc => lotes.push({ id: doc.id, ...doc.data() }));

    document.getElementById('total-lotes').textContent = lotes.length;
    document.getElementById('total-medidores').textContent = lotes.reduce((a, l) => a + (l.cantidadMedidores || 0), 0);

    const contenedor = document.getElementById('lista-lotes');
    if (lotes.length === 0) {
      contenedor.innerHTML = '<div class="empty-state">Aún no hay lotes registrados</div>';
    } else {
      contenedor.innerHTML = lotes.map(l => {
        const conObs = (l.medidores || []).some(m => m.observacion && m.observacion !== 'NINGUNA');
        return `
        <div class="glass-card">
          <div class="lote-row">
            <div>
              <div class="lote-title">${l.lote || 'Lote'}</div>
              <div class="lote-sub">${l.operario || ''} · ${l.fecha || ''}</div>
              ${conObs ? '<span class="observ-tag">⚠ Con observaciones</span>' : ''}
            </div>
            <span class="badge">${l.cantidadMedidores || 0} medidores</span>
          </div>
        </div>`;
      }).join('');
    }

    if (primerCarga) {
      primerCarga = false;
      return;
    }

    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') {
        const data = change.doc.data();
        nuevosNoLeidos++;
        const badge = document.getElementById('badge-count');
        badge.textContent = nuevosNoLeidos;
        badge.classList.add('show');

        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('Nuevo lote registrado', {
            body: `${data.operario || 'Operario'} · ${data.lote || ''} · ${data.cantidadMedidores || 0} medidores`
          });
        }
      }
    });
  });
</script>
</body>
</html>

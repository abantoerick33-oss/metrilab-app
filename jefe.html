<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0F">
  <title>MetriLab · Panel del Jefe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A0A0F;
      color: white;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1A1A2E 0%, #0A0A0F 100%);
      z-index: -2;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(155, 89, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
      z-index: -1;
    }

    #app { max-width: 900px; margin: 0 auto; padding: 20px; }

    .topbar {
      padding: 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(155, 89, 246, 0.2);
      margin-bottom: 24px;
    }
    .topbar-title {
      font-size: 28px; font-weight: bold;
      background: linear-gradient(135deg, #9B59F6, #00D4FF);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .topbar-sub { color: rgba(255,255,255,0.5); font-size: 13px; margin-top: 4px; }

    .status-dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      background: #10b981; box-shadow: 0 0 10px #10b981;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .status-text { font-size: 12px; color: rgba(255,255,255,0.7); margin-left: 6px; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .metric-card {
      background: linear-gradient(135deg, rgba(26, 26, 46, 0.7), rgba(42, 26, 62, 0.3));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(155, 89, 246, 0.2);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .metric-card.cyan { border-color: rgba(0, 212, 255, 0.3); }
    .metric-card.green { border-color: rgba(46, 204, 113, 0.3); }
    .metric-val { font-size: 32px; font-weight: bold; color: white; margin-bottom: 4px; }
    .metric-label { font-size: 12px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; }

    .section-title {
      font-size: 18px; font-weight: bold; color: white;
      margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
    }

    .filter-bar {
      display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .filter-btn {
      background: rgba(26, 26, 46, 0.6);
      border: 1px solid rgba(58, 46, 93, 0.5);
      color: rgba(255,255,255,0.7);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.3s;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #9B59F6, #00D4FF);
      color: white;
      border-color: transparent;
    }

    .lote-card {
      background: linear-gradient(135deg, rgba(26, 26, 46, 0.7), rgba(42, 26, 62, 0.3));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(58, 46, 93, 0.3);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      transition: all 0.3s;
    }
    .lote-card:hover { border-color: rgba(155, 89, 246, 0.4); }
    .lote-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .lote-title { font-size: 16px; font-weight: 600; color: white; }
    .lote-badge {
      background: rgba(46, 204, 113, 0.2);
      color: #2ECC40;
      border: 1px solid rgba(46, 204, 113, 0.4);
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .lote-info {
      display: flex; gap: 20px; flex-wrap: wrap;
      font-size: 12px; color: rgba(255,255,255,0.6);
      margin-bottom: 12px;
    }
    .lote-info span strong { color: white; }
    .lote-detalles {
      display: none;
      background: rgba(10, 10, 15, 0.5);
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }
    .lote-detalles.show { display: block; }

    .medidor-row {
      display: grid;
      grid-template-columns: 30px 1fr 1fr 1fr;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 11px;
      align-items: center;
    }
    .medidor-row:last-child { border: none; }
    .med-num {
      background: linear-gradient(135deg, #9B59F6, #00D4FF);
      color: white; padding: 2px 6px; border-radius: 6px;
      font-size: 10px; font-weight: 600; text-align: center;
    }

    .toggle-btn {
      background: rgba(155, 89, 246, 0.15);
      border: 1px solid rgba(155, 89, 246, 0.3);
      color: #9B59F6;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
    }

    .empty-state {
      text-align: center; padding: 60px 20px;
      color: rgba(255,255,255,0.4);
    }
    .empty-state svg { width: 60px; height: 60px; fill: rgba(155, 89, 246, 0.3); margin-bottom: 12px; }

    .loading {
      text-align: center; padding: 40px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(155, 89, 246, 0.2);
      border-top-color: #9B59F6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .medidor-row { grid-template-columns: 25px 1fr 1fr; font-size: 10px; }
      .med-precinto-col { display: none; }
    }
  </style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div>
      <div class="topbar-title">📊 MetriLab · Panel del Jefe</div>
      <div class="topbar-sub">Monitoreo en tiempo real</div>
    </div>
    <div>
      <span class="status-dot"></span>
      <span class="status-text" id="status-text">Conectando...</span>
    </div>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-val" id="total-lotes">0</div>
      <div class="metric-label">Lotes totales</div>
    </div>
    <div class="metric-card cyan">
      <div class="metric-val" id="total-medidores">0</div>
      <div class="metric-label">Medidores</div>
    </div>
    <div class="metric-card green">
      <div class="metric-val" id="lotes-hoy">0</div>
      <div class="metric-label">Lotes hoy</div>
    </div>
  </div>

  <div class="section-title">📋 Lotes por operario</div>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" onclick="filtrar('todos')">Todos</button>
    <button class="filter-btn" onclick="filtrar('Joseph')">Joseph</button>
    <button class="filter-btn" onclick="filtrar('Marco')">Marco</button>
  </div>

  <div id="lista-lotes">
    <div class="loading">
      <div class="spinner"></div>
      <p style="font-size:13px;color:rgba(255,255,255,0.6)">Cargando lotes desde Firebase...</p>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCpRopyllFTQu3puQtRlLWAy83JXXgvXI0",
  authDomain: "metrilab-appjefe.firebaseapp.com",
  projectId: "metrilab-appjefe",
  storageBucket: "metrilab-appjefe.firebasestorage.app",
  messagingSenderId: "407817648389",
  appId: "1:407817648389:web:425dcf5f446ecd3a2f5f6c",
  measurementId: "G-WBYTEMYJRK"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let todosLotes = [];
let filtroActual = 'todos';

const q = query(collection(db, "lotes"), orderBy("creado", "desc"));

onSnapshot(q, (snapshot) => {
  todosLotes = [];
  snapshot.forEach((doc) => {
    todosLotes.push({ id: doc.id, ...doc.data() });
  });
  document.getElementById('status-text').textContent = 'Conectado · Actualizando en tiempo real';
  actualizarPanel();
}, (error) => {
  console.error(error);
  document.getElementById('status-text').textContent = 'Error de conexión';
});

window.filtrar = function(operario) {
  filtroActual = operario;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  actualizarPanel();
};

window.toggleDetalles = function(id) {
  const el = document.getElementById('detalles-' + id);
  el.classList.toggle('show');
};

function actualizarPanel() {
  let lotesFiltrados = todosLotes;
  if (filtroActual !== 'todos') {
    lotesFiltrados = todosLotes.filter(l =>
      (l.operario || '').toLowerCase().includes(filtroActual.toLowerCase())
    );
  }

  document.getElementById('total-lotes').textContent = todosLotes.length;
  document.getElementById('total-medidores').textContent = todosLotes.reduce((a, l) => a + (l.cantidadMedidores || (l.medidores?.length || 0)), 0);

  const hoy = new Date().toLocaleDateString('es-PE', {timeZone: 'America/Lima'});
  const lotesHoy = todosLotes.filter(l => {
    if (!l.fecha) return false;
    return l.fecha.includes(hoy.replaceAll('/', '/')) || (l.creado && new Date(l.creado.seconds * 1000).toLocaleDateString('es-PE', {timeZone: 'America/Lima'}) === hoy);
  });
  document.getElementById('lotes-hoy').textContent = lotesHoy.length;

  const contenedor = document.getElementById('lista-lotes');
  if (lotesFiltrados.length === 0) {
    contenedor.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .89-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zm-3.5 11l-4.5-4.5-4.5 4.5-1-1 5.5-5.5 5.5 5.5-1 1z"/></svg>
        <p>No hay lotes para mostrar</p>
      </div>`;
    return;
  }

  contenedor.innerHTML = lotesFiltrados.map(l => `
    <div class="lote-card">
      <div class="lote-header">
        <div class="lote-title">${l.lote || 'Sin código'}</div>
        <span class="lote-badge">✓ OK</span>
      </div>
      <div class="lote-info">
        <span>👤 <strong>${l.operario || 'Sin operario'}</strong></span>
        <span>📅 <strong>${l.fecha || 'Sin fecha'}</strong></span>
        <span>📦 <strong>${l.cantidadMedidores || (l.medidores?.length || 0)} medidores</strong></span>
      </div>
      <button class="toggle-btn" onclick="toggleDetalles('${l.id}')">Ver detalles ▾</button>
      <div class="lote-detalles" id="detalles-${l.id}">
        ${renderMedidores(l.medidores || [])}
      </div>
    </div>
  `).join('');
}

function renderMedidores(medidores) {
  if (!medidores.length) return '<p style="font-size:12px;color:rgba(255,255,255,0.4)">Sin medidores</p>';
  return `
    <div class="medidor-row" style="font-weight:600;color:rgba(255,255,255,0.6);text-transform:uppercase;font-size:9px;letter-spacing:1px">
      <span>#</span>
      <span>Serie medidor</span>
      <span>Registro</span>
      <span class="med-precinto-col">Precinto</span>
    </div>
    ${medidores.map((m, i) => `
      <div class="medidor-row">
        <span class="med-num">${i+1}</span>
        <span>${m.serie_medidor || '—'}</span>
        <span>${m.registro || '—'} ${m.unidad || 'm³'}</span>
        <span class="med-precinto-col">${m.serie_precinto || 'N/D'}</span>
      </div>
    `).join('')}
  `;
}
</script>
</body>
</html>

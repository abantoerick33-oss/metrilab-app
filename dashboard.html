<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0F">
  <title>MetriLab · Dashboard</title>
  <link rel="icon" type="image/png" href="icon-jefe.png">
  <link rel="apple-touch-icon" href="icon-jefe.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A0A0F;
      color: white;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1A1A2E 0%, #0A0A0F 100%);
      z-index: -2;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(155, 89, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
      z-index: -1;
    }

    #app { max-width: 900px; margin: 0 auto; padding: 20px; }

    .topbar {
      padding: 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(155, 89, 246, 0.2);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .topbar-title {
      font-size: 28px; font-weight: bold;
      background: linear-gradient(135deg, #9B59F6, #00D4FF);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .topbar-sub { color: rgba(255,255,255,0.5); font-size: 13px; margin-top: 4px; }

    .nav-link {
      background: rgba(155, 89, 246, 0.15);
      border: 1px solid rgba(155, 89, 246, 0.3);
      color: #9B59F6;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .section-title {
      font-size: 18px; font-weight: bold; color: white;
      margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
    }

    .dashboard-header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      margin-bottom: 18px;
    }
    .mes-selector {
      background: rgba(26, 26, 46, 0.6);
      border: 1px solid rgba(58, 46, 93, 0.5);
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .dash-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .dash-stat-card {
      background: linear-gradient(135deg, rgba(26, 26, 46, 0.7), rgba(42, 26, 62, 0.3));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(155, 89, 246, 0.2);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .dash-stat-val { font-size: 30px; font-weight: bold; color: white; }
    .dash-stat-label { font-size: 12px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px; }
    .dash-charts {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 18px;
    }
    .dash-chart-box {
      background: linear-gradient(135deg, rgba(26, 26, 46, 0.7), rgba(42, 26, 62, 0.3));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(58, 46, 93, 0.3);
      border-radius: 16px;
      padding: 16px;
    }
    .dash-chart-title { font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    @media (max-width: 700px) {
      .dash-charts { grid-template-columns: 1fr; }
    }

    .loading { text-align: center; padding: 40px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(155, 89, 246, 0.2);
      border-top-color: #9B59F6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div>
      <div class="topbar-title">📊 MetriLab · Dashboard</div>
      <div class="topbar-sub">Resumen mensual de avances</div>
    </div>
    <a href="jefe.html" class="nav-link">← Panel del Jefe</a>
  </div>

  <div class="dashboard-header">
    <div class="section-title" style="margin-bottom:0">Resumen del mes</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <select class="mes-selector" id="mes-selector" onchange="cambiarMes(this.value)"></select>
      <button class="nav-link" style="cursor:pointer;border:1px solid rgba(0,212,255,0.3);background:rgba(0,212,255,0.15);color:#00D4FF" onclick="descargarExcel()">📥 Descargar Excel</button>
    </div>
  </div>

  <div class="dash-stats">
    <div class="dash-stat-card">
      <div class="dash-stat-val" id="dash-total-lotes">0</div>
      <div class="dash-stat-label">Lotes del mes</div>
    </div>
    <div class="dash-stat-card">
      <div class="dash-stat-val" id="dash-total-medidores">0</div>
      <div class="dash-stat-label">Medidores del mes</div>
    </div>
    <div class="dash-stat-card">
      <div class="dash-stat-val" id="dash-promedio">0</div>
      <div class="dash-stat-label">Medidores / lote</div>
    </div>
    <div class="dash-stat-card">
      <div class="dash-stat-val" id="dash-eliminados">0</div>
      <div class="dash-stat-label">Lotes eliminados</div>
    </div>
  </div>

  <div class="dash-charts" id="dash-charts-container">
    <div class="dash-chart-box">
      <div class="dash-chart-title">Lotes por día</div>
      <canvas id="chart-dias" height="140"></canvas>
    </div>
    <div class="dash-chart-box">
      <div class="dash-chart-title">Por operario</div>
      <canvas id="chart-operario" height="140"></canvas>
    </div>
    <div class="dash-chart-box">
      <div class="dash-chart-title">Por origen</div>
      <canvas id="chart-origen" height="140"></canvas>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCpRopyllFTQu3puQtRlLWAy83JXXgvXI0",
  authDomain: "metrilab-appjefe.firebaseapp.com",
  projectId: "metrilab-appjefe",
  storageBucket: "metrilab-appjefe.firebasestorage.app",
  messagingSenderId: "407817648389",
  appId: "1:407817648389:web:425dcf5f446ecd3a2f5f6c",
  measurementId: "G-WBYTEMYJRK"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let todosLotes = [];
let mesSeleccionado = null;
let chartDias, chartOperario, chartOrigen;

const q = query(collection(db, "lotes"), orderBy("creado", "desc"));

onSnapshot(q, (snapshot) => {
  todosLotes = [];
  snapshot.forEach((doc) => {
    todosLotes.push({ id: doc.id, ...doc.data() });
  });
  poblarSelectorMeses();
  actualizarDashboard();
}, (error) => {
  console.error(error);
});

function mesKeyDeLote(l) {
  if (!l.creado || !l.creado.seconds) return null;
  const d = new Date(l.creado.seconds * 1000);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function mesLabel(key) {
  const [y, m] = key.split('-');
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${meses[parseInt(m) - 1]} ${y}`;
}

function poblarSelectorMeses() {
  const meses = [...new Set(todosLotes.map(mesKeyDeLote).filter(Boolean))].sort().reverse();
  if (!mesSeleccionado || !meses.includes(mesSeleccionado)) {
    mesSeleccionado = meses[0] || null;
  }
  const sel = document.getElementById('mes-selector');
  sel.innerHTML = meses.map(m => `<option value="${m}" ${m === mesSeleccionado ? 'selected' : ''}>${mesLabel(m)}</option>`).join('');
}

window.cambiarMes = function(valor) {
  mesSeleccionado = valor;
  actualizarDashboard();
};

function actualizarDashboard() {
  if (!mesSeleccionado) return;
  const lotesDelMes = todosLotes.filter(l => mesKeyDeLote(l) === mesSeleccionado);
  const activos = lotesDelMes.filter(l => !l.eliminado);
  const eliminados = lotesDelMes.filter(l => l.eliminado);
  const totalMedidores = activos.reduce((a, l) => a + (l.cantidadMedidores || (l.medidores?.length || 0)), 0);

  document.getElementById('dash-total-lotes').textContent = activos.length;
  document.getElementById('dash-total-medidores').textContent = totalMedidores;
  document.getElementById('dash-promedio').textContent = activos.length ? (totalMedidores / activos.length).toFixed(1) : '0';
  document.getElementById('dash-eliminados').textContent = eliminados.length;

  const [y, m] = mesSeleccionado.split('-').map(Number);
  const diasEnMes = new Date(y, m, 0).getDate();
  const porDia = new Array(diasEnMes).fill(0);
  activos.forEach(l => {
    if (l.creado && l.creado.seconds) {
      const dia = new Date(l.creado.seconds * 1000).getDate();
      porDia[dia - 1]++;
    }
  });

  const operarios = {};
  activos.forEach(l => {
    const nombre = (l.operario || 'Sin operario').split(' ')[0];
    operarios[nombre] = (operarios[nombre] || 0) + 1;
  });

  const origenes = { web: 0, app: 0 };
  activos.forEach(l => {
    const o = (l.origen || 'app') === 'web' ? 'web' : 'app';
    origenes[o]++;
  });

  renderCharts(porDia, operarios, origenes, diasEnMes);
}

function renderCharts(porDia, operarios, origenes, diasEnMes) {
  const colorPurple = '#9B59F6', colorCyan = '#00D4FF', colorGreen = '#2ECC71';
  const legendStyle = { position: 'bottom', labels: { color: 'rgba(255,255,255,0.7)', font: { size: 10 }, boxWidth: 10 } };

  if (chartDias) chartDias.destroy();
  chartDias = new Chart(document.getElementById('chart-dias'), {
    type: 'bar',
    data: {
      labels: Array.from({ length: diasEnMes }, (_, i) => i + 1),
      datasets: [{ label: 'Lotes', data: porDia, backgroundColor: colorPurple, borderRadius: 4 }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 9 } }, grid: { display: false } },
        y: { ticks: { color: 'rgba(255,255,255,0.5)', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true }
      }
    }
  });

  if (chartOperario) chartOperario.destroy();
  chartOperario = new Chart(document.getElementById('chart-operario'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(operarios),
      datasets: [{ data: Object.values(operarios), backgroundColor: [colorPurple, colorCyan, colorGreen] }]
    },
    options: { plugins: { legend: legendStyle } }
  });

  if (chartOrigen) chartOrigen.destroy();
  chartOrigen = new Chart(document.getElementById('chart-origen'), {
    type: 'doughnut',
    data: {
      labels: ['🌐 Web', '📱 App'],
      datasets: [{ data: [origenes.web, origenes.app], backgroundColor: [colorCyan, colorPurple] }]
    },
    options: { plugins: { legend: legendStyle } }
  });
}

window.descargarExcel = async function() {
  if (!mesSeleccionado) { alert('No hay datos para descargar todavía'); return; }
  const lotesDelMes = todosLotes.filter(l => mesKeyDeLote(l) === mesSeleccionado);
  const activos = lotesDelMes.filter(l => !l.eliminado);
  const eliminados = lotesDelMes.filter(l => l.eliminado);
  const totalMedidores = activos.reduce((a, l) => a + (l.cantidadMedidores || (l.medidores?.length || 0)), 0);

  const AZUL = '17375E', VERDE = '2E8B57', ROJO = 'C0392B', GRIS = 'F4F6F7', BLANCO = 'FFFFFF', MORADO = '8E44AD';
  const borde = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
  const bordeMedio = { top: { style: 'medium' }, left: { style: 'medium' }, bottom: { style: 'medium' }, right: { style: 'medium' } };

  function aplicar(ws, celda, valor, opts = {}) {
    const c = ws.getCell(celda);
    c.value = valor;
    c.font = { bold: opts.negrita || false, size: opts.tam || 10, color: { argb: 'FF' + (opts.color_texto || '000000') }, italic: opts.italica || false };
    c.alignment = { horizontal: opts.alineacion || 'center', vertical: 'middle', wrapText: opts.wrap !== false };
    if (opts.color_fondo) c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + opts.color_fondo } };
    c.border = opts.borde || borde;
  }

  const wb = new ExcelJS.Workbook();

  const ws1 = wb.addWorksheet('Resumen por lote');
  [18, 26, 16, 12, 12, 12, 30].forEach((a, i) => { ws1.getColumn(i + 1).width = a; });

  ws1.mergeCells('A1:G1');
  aplicar(ws1, 'A1', 'METRILAB · RESUMEN MENSUAL DE LOTES', { negrita: true, tam: 16, color_texto: BLANCO, color_fondo: AZUL, borde: bordeMedio });
  ws1.getRow(1).height = 30;

  ws1.mergeCells('A2:G2');
  aplicar(ws1, 'A2', `Mes: ${mesLabel(mesSeleccionado)} · Generado el ${new Date().toLocaleString('es-PE', { timeZone: 'America/Lima' })}`, { tam: 10, italica: true, color_texto: '404040', color_fondo: GRIS });
  ws1.getRow(2).height = 18;
  ws1.getRow(3).height = 6;

  const tarjetas = [
    ['A4:B5', 'LOTES DEL MES', String(activos.length), AZUL],
    ['C4:D5', 'MEDIDORES', String(totalMedidores), VERDE],
    ['E4:F5', 'PROMEDIO/LOTE', activos.length ? (totalMedidores / activos.length).toFixed(1) : '0', MORADO],
    ['G4:G5', 'ELIMINADOS', String(eliminados.length), ROJO]
  ];
  tarjetas.forEach(([rango, titulo, valor, color]) => {
    ws1.mergeCells(rango);
    aplicar(ws1, rango.split(':')[0], `${titulo}\n${valor}`, { negrita: true, tam: 11, color_texto: BLANCO, color_fondo: color, borde: bordeMedio });
  });
  ws1.getRow(4).height = 26;
  ws1.getRow(5).height = 26;
  ws1.getRow(6).height = 6;

  const headers1 = ['Lote', 'Operario', 'Fecha', 'Origen', 'Medidores', 'Estado', 'Motivo eliminación'];
  headers1.forEach((h, i) => { aplicar(ws1, ws1.getCell(7, i + 1).address, h, { negrita: true, tam: 10, color_texto: BLANCO, color_fondo: ROJO }); });
  ws1.getRow(7).height = 20;

  activos.concat(eliminados).forEach((l, i) => {
    const fila = 8 + i;
    const colorFila = l.eliminado ? 'FDEDEC' : (i % 2 === 0 ? GRIS : BLANCO);
    const valores = [
      l.lote || '', l.operario || '', l.fecha || '',
      (l.origen || 'app') === 'web' ? '🌐 Web' : '📱 App móvil',
      l.cantidadMedidores || (l.medidores?.length || 0),
      l.eliminado ? '❌ Eliminado' : '✓ Activo',
      l.motivoEliminacion || ''
    ];
    valores.forEach((v, j) => { aplicar(ws1, ws1.getCell(fila, j + 1).address, v, { tam: 9, color_fondo: colorFila, alineacion: (j === 1 || j === 6) ? 'left' : 'center' }); });
    ws1.getRow(fila).height = 16;
  });

  const ws2 = wb.addWorksheet('Detalle medidores');
  [18, 26, 16, 16, 16, 16, 16, 30].forEach((a, i) => { ws2.getColumn(i + 1).width = a; });

  ws2.mergeCells('A1:H1');
  aplicar(ws2, 'A1', 'DETALLE DE MEDIDORES POR LOTE', { negrita: true, tam: 14, color_texto: BLANCO, color_fondo: AZUL, borde: bordeMedio });
  ws2.getRow(1).height = 26;

  const headers2 = ['Lote', 'Operario', 'Fecha', 'Serie medidor', 'Registro inicial', 'Registro final', 'Precinto', 'Observación'];
  headers2.forEach((h, i) => { aplicar(ws2, ws2.getCell(3, i + 1).address, h, { negrita: true, tam: 10, color_texto: BLANCO, color_fondo: ROJO }); });
  ws2.getRow(3).height = 20;

  let fila2 = 4;
  lotesDelMes.forEach(l => {
    (l.medidores || []).forEach((m, idx) => {
      const colorFila = idx % 2 === 0 ? GRIS : BLANCO;
      const obsColor = (m.observacion && m.observacion !== 'NINGUNA') ? 'FDEDEC' : colorFila;
      const valores = [l.lote || '', l.operario || '', l.fecha || '', m.serie_medidor || '', m.registro || '', m.registro_final || '', m.serie_precinto || '', m.observacion || 'NINGUNA'];
      valores.forEach((v, j) => { aplicar(ws2, ws2.getCell(fila2, j + 1).address, v, { tam: 9, color_fondo: j === 7 ? obsColor : colorFila, alineacion: (j === 1 || j === 7) ? 'left' : 'center' }); });
      ws2.getRow(fila2).height = 16;
      fila2++;
    });
  });

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `MetriLab_Dashboard_${mesSeleccionado}.xlsx`;
  a.click();
};
</script>
</body>
</html>
